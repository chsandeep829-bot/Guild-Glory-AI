name: Build and deploy Guild Glory AI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy frontend and backend to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Configure Worker runtime secrets
        env:
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          B2_KEY_ID: ${{ vars.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'const fs=require("fs"); const keys=["TURSO_DATABASE_URL","TURSO_AUTH_TOKEN","B2_KEY_ID","B2_APPLICATION_KEY","B2_BUCKET_NAME","B2_ENDPOINT","B2_REGION","GEMINI_API_KEY"]; const out={}; for (const k of keys) if (process.env[k]) out[k]=process.env[k]; fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(out));'
          wrangler secret bulk /tmp/worker-secrets.json
          rm -f /tmp/worker-secrets.json
